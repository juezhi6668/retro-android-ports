##### wpa_supplicant configuration file template for cooper (GT-S5830, ar6000) #####
# Donut hardware/libhardware_legacy/wifi/wifi.c copies this from
# /system/etc/wifi/wpa_supplicant.conf to /data/misc/wifi/wpa_supplicant.conf
# on first WiFi enable (ensure_config_file_exists). ctrl_interface MUST be
# the bare iface name "wlan0": wpa_ctrl + ctrl_iface_unix.c derive the
# reserved socket name "wpa_wlan0" from it, matching the
# `socket wpa_wlan0 dgram 660 wifi wifi` line in init.gt-s5830.rc.
update_config=1
ctrl_interface=wlan0
eapol_version=1
ap_scan=1
fast_reauth=1
