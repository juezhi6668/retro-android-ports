# WCNSS_qcom_cfg.ini for maple (Sony Xperia XZ Premium, WCN3990/cherokee
# via qca_cld3 built into the 4.4 kernel).
#
# Minimal first-bringup set — verify-me live. The driver uses built-in
# defaults for everything not listed here.
#
# Source pattern: CHARQUIRKS wifi ("gIPAConfig=0 in the ini, ipa offload
# off, nothing on 4.2 brings ipa up"). Same applies on KitKat/maple: the
# 4.4 kernel's ipa_smmu_wlan already fails to alloc its iommu domain at
# boot (dmesg 2026-10-16: "ipa_smmu_wlan_cb_probe: could not alloc iommu
# domain"), so leaving IPA on would blackhole the data path. Off.
#
# Long term this file should converge on lineage's
# vendor/firmware/wlan/qca_cld/WCNSS_qcom_cfg.ini plus Sony's bdwlan
# overrides (proprietary-files-vendor lists vendor/etc/wifi/bdwlan.bin;
# the modem partition carries bdwlan.* calibration live). Staged firmware
# dir on this port: /system/vendor/firmware/wlan/qca_cld/
# (firmware_class.path is /vendor/firmware; /vendor -> /system/vendor).
gIPAConfig=0
END
