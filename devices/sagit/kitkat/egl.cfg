# EGL driver list (copied to /system/lib/egl/egl.cfg by BOARD_EGL_CFG).
# KitKat's Loader finds the shims by naming convention (libEGL_adreno.so,
# libGLESv1_CM_adreno.so, libGLESv2_adreno.so in /system/lib/egl) and this
# file keeps the stock device layout for anything that reads it.
0 0 android
0 1 adreno
