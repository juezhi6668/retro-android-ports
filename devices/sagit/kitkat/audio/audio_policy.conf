# audio_policy.conf for the msm8998 boards (Mi 6 sagit / Mi MIX 2 chiron;
# shipped to both products, audio.primary.msm8998).
#
# Single "primary" module -> audio.primary.msm8998 (vendor/xiaomi/sagit/audio,
# tinyalsa HAL written for this port per CHARQUIRKS audio). Card is
# msm8998-tasha-snd-card (WCD9341) through the adsp; ACDB calibration comes
# from the Mi 6 ROM via libhyb's libacdbloader.
# verify-me live: ringtones + sound recorder once the card probes.
# (BT SCO goes over slimbus into the adsp with nothing driving it on old
# Android — CHARQUIRKS: "no call audio over headsets". SCO devices are listed
# so the framework doesn't crash, not because they work.)

global_configuration {
  attached_output_devices AUDIO_DEVICE_OUT_SPEAKER
  default_output_device AUDIO_DEVICE_OUT_SPEAKER
  attached_input_devices AUDIO_DEVICE_IN_BUILTIN_MIC
}

audio_hw_modules {
  primary {
    outputs {
      primary {
        sampling_rates 48000
        channel_masks AUDIO_CHANNEL_OUT_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_OUT_SPEAKER|AUDIO_DEVICE_OUT_WIRED_HEADSET|AUDIO_DEVICE_OUT_WIRED_HEADPHONE
        flags AUDIO_OUTPUT_FLAG_PRIMARY
      }
    }
    inputs {
      primary {
        sampling_rates 8000|11025|16000|22050|44100|48000
        channel_masks AUDIO_CHANNEL_IN_MONO|AUDIO_CHANNEL_IN_STEREO
        formats AUDIO_FORMAT_PCM_16_BIT
        devices AUDIO_DEVICE_IN_BUILTIN_MIC|AUDIO_DEVICE_IN_WIRED_HEADSET
      }
    }
  }
}
